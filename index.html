<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="A simple and responsive calendar for managing events."
  >

  <title>Calendar with Events</title>

  <link rel="stylesheet" href="styles.css">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
  >
</head>

<body>
  <main>
    <section
      class="card"
      role="application"
      aria-label="Calendar with Events"
    >

      <!-- Calendar navigation -->
      <header class="calendar-toolbar">
        <button
          type="button"
          class="month-btn prev"
          aria-label="Previous month"
          title="Previous month"
        >
          <i class="fas fa-chevron-left" aria-hidden="true"></i>
        </button>

        <h1
          class="current-month"
          aria-live="polite"
          aria-atomic="true"
        ></h1>

        <button
          type="button"
          class="month-btn next"
          aria-label="Next month"
          title="Next month"
        >
          <i class="fas fa-chevron-right" aria-hidden="true"></i>
        </button>
      </header>

      <!-- Calendar -->
      <div class="calendar">
        <div
          class="weekdays"
          aria-hidden="true"
        >
          <div class="weekday-name">Su</div>
          <div class="weekday-name">Mo</div>
          <div class="weekday-name">Tu</div>
          <div class="weekday-name">We</div>
          <div class="weekday-name">Th</div>
          <div class="weekday-name">Fr</div>
          <div class="weekday-name">Sa</div>
        </div>

        <div
          class="calendar-days"
          role="grid"
          aria-label="Calendar days"
        ></div>
      </div>

      <!-- Add event -->
      <div class="calendar-actions">
        <button
          type="button"
          id="openAddEvent"
          class="btn"
        >
          <i class="fas fa-plus" aria-hidden="true"></i>
          Add Event
        </button>
      </div>

      <!-- Calendar shortcuts -->
      <nav
        class="goto-buttons"
        aria-label="Calendar navigation shortcuts"
      >
        <button
          type="button"
          class="btn prev-year"
          aria-label="Go to previous year"
        >
          Prev Year
        </button>

        <button
          type="button"
          class="btn today"
          aria-label="Go to today"
        >
          Today
        </button>

        <button
          type="button"
          class="btn next-year"
          aria-label="Go to next year"
        >
          Next Year
        </button>
      </nav>

    </section>
  </main>

  <!-- Event modal -->
  <div
    id="modalBackdrop"
    class="modal-backdrop"
    aria-hidden="true"
  >
    <div
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >

      <h2 id="modalTitle">Add Event</h2>

      <!-- Event form -->
      <form id="eventForm">

        <div class="field">
          <label for="eventDate">Date</label>

          <input
            type="date"
            id="eventDate"
            name="eventDate"
            required
          >
        </div>

        <div class="field">
          <label for="eventTitle">Title</label>

          <input
            type="text"
            id="eventTitle"
            name="eventTitle"
            placeholder="Enter event title"
            autocomplete="off"
            maxlength="100"
            required
          >
        </div>

        <div class="modal-actions">
          <button
            type="button"
            id="cancelEvent"
            class="btn"
          >
            Cancel
          </button>

          <button
            type="submit"
            class="btn"
          >
            Save
          </button>
        </div>

      </form>

      <!-- Events for selected day -->
      <section
        id="dayEventsContainer"
        aria-labelledby="dayLabel"
        style="display: none;"
      >
        <h2 id="dayLabel">Events</h2>

        <div
          class="event-list"
          id="eventList"
        ></div>

        <div class="day-events-actions">
          <button
            type="button"
            id="closeDayEvents"
            class="btn"
          >
            Close
          </button>
        </div>
      </section>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
